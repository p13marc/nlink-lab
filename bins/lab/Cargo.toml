[package]
name = "nlink-lab-cli"
description = "CLI for nlink-lab network lab engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not on crates.io: releases are Forgejo tarballs + flatpak (deny.toml relies on this)
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["networking", "testing", "namespaces", "lab", "cli"]
categories = ["command-line-utilities", "network-programming"]
readme = "../../README.md"

[[bin]]
name = "nlink-lab"
path = "src/main.rs"

[features]
default = []
# Forwards to `nlink-lab/legacy-tcpdump-filter`. With this feature
# off (default), passing `--filter "<tcpdump expr>"` errors with a
# migration message pointing at the typed `--filter-*` flags.
legacy-tcpdump-filter = ["nlink-lab/legacy-tcpdump-filter"]

[dependencies]
nlink-lab = { workspace = true }
# Orphan reaper / force cleanup: namespace list+delete and root-ns link
# dump+delete go through nlink instead of shelling out to `ip` (#29).
nlink = { workspace = true }
netring = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zenoh = { workspace = true }
nlink-lab-shared = { workspace = true }
nlink-lab-backend = { path = "../nlink-lab-backend" }
miette = { version = "7", features = ["fancy"] }

# `spawn --wait-log REGEX` compiles the user's regex CLI-side and
# passes it to `RunningLab::wait_for_log_line` (Plan 155 PR E).
regex = "1"

[dev-dependencies]
tempfile = "3"
