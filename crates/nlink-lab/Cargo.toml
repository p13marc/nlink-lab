[package]
name = "nlink-lab"
description = "Network lab engine for creating isolated, reproducible network topologies using Linux namespaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not on crates.io: releases are Forgejo tarballs + flatpak (deny.toml relies on this)
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["networking", "testing", "namespaces", "lab", "topology"]
categories = ["network-programming", "development-tools::testing"]
readme = "../../README.md"

[features]
default = ["wireguard"]
# Key generation and derivation are nlink's (`PrivateKey`, the
# `wireguard-keys` feature its `full` includes).
wireguard = []

[dependencies]
nlink-lab-shared = { workspace = true }
nlink = { workspace = true }
tokio = { workspace = true }
# Plan 159b — `watch` module consumes nlink's
# `ResyncStream` through tokio_stream's `StreamExt::next()`.
tokio-stream = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
logos = "0.16"
time = { workspace = true }
miette = { version = "7", features = ["fancy"] }
nlink-lab-macros = { workspace = true }

# Lab archive (.nlz) — Plan 153 export / import.
tar = "0.4"
flate2 = "1"
sha2 = "0.11"

# `LabCapture` writes pcaps to a temp dir (Plan 154 capture-on-failure).
tempfile = "3"

# `wait_for_log_line` regex matching for `spawn --wait-log` (Plan 155 PR E).
regex = "1"

netring = { workspace = true }

# Feature-gated dependencies

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
libc = { workspace = true }
tempfile = "3"
