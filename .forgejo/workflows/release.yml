name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # re-run a failed release without deleting/re-pushing the tag. On dispatch
  # the run executes on a BRANCH ref (GITHUB_REF_NAME is e.g. "master"), so
  # every step must use the resolved RELEASE_TAG/RELEASE_SHA env instead.
  workflow_dispatch:
    inputs:
      tag:
        description: existing bare-semver tag to re-release
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
      - name: Build release artifacts
        run: |
          mkdir -p dist/release
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="${name}-${RELEASE_TAG}/" \
            -o "dist/release/${name}-${RELEASE_TAG}.tar.gz" "${RELEASE_TAG}"
          (cd dist/release && sha256sum * > SHA256SUMS)
      - uses: https://data.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          # internal URL: the runner zone cannot hairpin to the public vhost
          url: http://10.10.0.30:3000
          repo: ${{ github.repository }}
          tag: ${{ env.RELEASE_TAG }}
          sha: ${{ env.RELEASE_SHA }}
          release-dir: dist/release
          token: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    runs-on: flatpak
    # upload into the release created by the release job -- never runs a
    # racing create, and never use override: true (it wipes earlier assets)
    needs: release
    env:
      # SDK/runtime installs persist on the runner cache disk
      FLATPAK_USER_DIR: /srv/cache/flatpak/inst
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
      - name: Build flatpak (unsigned; vm-edge signs on publish)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # per-repo state dir on the cache disk: incremental module rebuilds
          # + ccache for C/C++ inside the sandbox. flatpak-builder requires
          # state dir and build tree on the same filesystem -> stage the
          # build on the cache disk and copy the bundle back.
          work=/srv/cache/flatpak/nlink-lab/work
          mkdir -p "$work" && rm -rf "$work/src" && cp -a . "$work/src"
          cd "$work/src"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --state-dir=/srv/cache/flatpak/nlink-lab/state --ccache \
            --install-deps-from=flathub \
            --repo=export-repo builddir flatpak/com.github.p13marc.NlinkLab.yml
          mkdir -p "$GITHUB_WORKSPACE/dist/release"
          flatpak build-bundle export-repo \
            "$GITHUB_WORKSPACE/dist/release/nlink-lab-topoviewer-${RELEASE_TAG}.flatpak" com.github.p13marc.NlinkLab
      - name: Publish export branch for vm-edge
        run: |
          cd /srv/cache/flatpak/nlink-lab/work/src/export-repo
          git init -q -b flatpak-export
          git add -A
          git -c user.name=ci -c user.email=ci@marcpardo.eu commit -q -m "flatpak export ${RELEASE_TAG}"
          git push --force "http://forgejo:${{ secrets.GITHUB_TOKEN }}@10.10.0.30:3000/${GITHUB_REPOSITORY}.git" HEAD:flatpak-export
      - name: Attach bundle to the release
        # forgejo-release@v2 tries to create the release and 409s when it
        # already exists (the release job created it) -> attach via the API.
        # Delete-then-upload keeps dispatch re-runs idempotent. Never
        # override:true (it recreates the release and wipes every asset).
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sf -H "Authorization: token $TOKEN" "$api/releases/tags/${RELEASE_TAG}" | jq -r .id)
          for f in "$GITHUB_WORKSPACE"/dist/release/*; do
            name=$(basename "$f")
            for aid in $(curl -sf -H "Authorization: token $TOKEN" "$api/releases/$rid/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id'); do
              curl -sf -X DELETE -H "Authorization: token $TOKEN" "$api/releases/$rid/assets/$aid" >/dev/null
            done
            curl -sf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$rid/assets?name=$name" >/dev/null
            echo "attached $name"
          done
