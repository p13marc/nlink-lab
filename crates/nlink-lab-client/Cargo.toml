[package]
name = "nlink-lab-client"
description = "Client of the nlink-lab daemon API (nlink-labd): a unix socket or an ssh dial-stdio, multiplexed calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not on crates.io: releases are Forgejo tarballs + flatpak (deny.toml relies on this)
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# `Endpoint::Zenoh`: the daemon's API over Zenoh
zenoh = ["dep:zenoh"]

[dependencies]
nlink-lab-shared = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zenoh = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
