app-id: com.github.p13marc.NlinkLab
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nlink-lab-gui

finish-args:
  # Wayland and X11 display access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for Iced/wgpu
  - --device=dri
  # Network access: a daemon reached over Zenoh on another host
  - --share=network
  # The nlink-lab daemon's sockets: its API (labs, changes, sessions) and
  # its Zenoh telemetry
  - --filesystem=/run/nlink-lab/api
  - --filesystem=/run/nlink-lab/zenoh
  # A `.nll` passed on the command line, read and saved by the editor:
  # files picked in Open… and Save as… come through the portal, these
  # need a path the sandbox sees. (Settings and node placements live in
  # the app's own ~/.var/app directory and need no permission.)
  - --filesystem=xdg-documents

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/nlink-lab-gui/cargo
    RUST_BACKTRACE: "1"

modules:
  - name: nlink-lab-gui
    buildsystem: simple
    build-options:
      # Allow network during build to fetch crates
      build-args:
        - --share=network
    build-commands:
      - cargo fetch --manifest-path Cargo.toml
      - cargo build --release -p nlink-lab-gui
      - install -Dm755 target/release/nlink-lab-gui ${FLATPAK_DEST}/bin/nlink-lab-gui
      - install -Dm644 flatpak/com.github.p13marc.NlinkLab.desktop ${FLATPAK_DEST}/share/applications/com.github.p13marc.NlinkLab.desktop
      - install -Dm644 flatpak/com.github.p13marc.NlinkLab.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.github.p13marc.NlinkLab.metainfo.xml
      # `text/x-nll` is ours; without this glob the desktop file's
      # `MimeType=` matches nothing (#48).
      - install -Dm644 flatpak/com.github.p13marc.NlinkLab.mime.xml ${FLATPAK_DEST}/share/mime/packages/com.github.p13marc.NlinkLab.xml
      - install -Dm644 flatpak/icons/hicolor/scalable/apps/com.github.p13marc.NlinkLab.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.github.p13marc.NlinkLab.svg
    sources:
      - type: dir
        path: ..
