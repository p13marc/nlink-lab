name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # re-run a failed release without deleting/re-pushing the tag. On dispatch
  # the run executes on a BRANCH ref (GITHUB_REF_NAME is e.g. "master"), so
  # every step must use the resolved RELEASE_TAG/RELEASE_SHA env instead.
  workflow_dispatch:
    inputs:
      tag:
        description: existing bare-semver tag to re-release
        required: true

env:
  # The runner sits in the isolated zone and reaches Forgejo through its
  # internal address, not the public ROOT_URL (issue #53: this used to be
  # repeated in four places).
  FORGEJO_API: http://10.10.0.30:3000/api/v1

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
      - name: Assert Cargo.toml version matches the tag
        # every release from v0.6.0 to v0.7.0 silently produced no assets
        # because the tag did not match the workflow pattern; make the
        # version/tag relationship a hard check instead of a convention.
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$v" = "$RELEASE_TAG" || { echo "::error::Cargo.toml version $v != tag $RELEASE_TAG"; exit 1; }
      - name: Require a green CI run for the tagged commit
        # A tag used to release with red fmt/clippy/test/deny (issue #53).
        # ci.yml runs on the push that carried the commit; wait for its
        # jobs (fuzz is skipped by design) and refuse on any failure.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="${FORGEJO_API}/repos/${GITHUB_REPOSITORY}"
          for attempt in $(seq 1 60); do
            tasks=$(curl -sf -H "Authorization: token $TOKEN" "$api/actions/tasks?limit=200" \
              | jq -c --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .workflow_id=="ci.yml")]')
            n=$(echo "$tasks" | jq 'length')
            bad=$(echo "$tasks" | jq '[.[] | select(.status=="failure" or .status=="cancelled")] | length')
            pending=$(echo "$tasks" | jq '[.[] | select(.status=="running" or .status=="waiting")] | length')
            if [ "$bad" != 0 ]; then echo "::error::CI is red for $RELEASE_SHA"; echo "$tasks" | jq -r '.[] | "\(.status) \(.name)"'; exit 1; fi
            if [ "$n" -ge 12 ] && [ "$pending" = 0 ]; then echo "CI green for $RELEASE_SHA ($n jobs)"; exit 0; fi
            echo "waiting for CI on $RELEASE_SHA ($n jobs seen, $pending pending)…"; sleep 30
          done
          echo "::error::no complete green ci.yml run for $RELEASE_SHA after 30 minutes"; exit 1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: release
          cache-targets: false
      - name: Build release artifacts
        run: |
          mkdir -p dist/release
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="${name}-${RELEASE_TAG}/" \
            -o "dist/release/${name}-${RELEASE_TAG}.tar.gz" "${RELEASE_TAG}"
          # the product itself: the CLI (+ backend) as a plain x86_64 gnu
          # binary tarball, with generated completions and a man page
          cargo build --release -p nlink-lab-cli -p nlink-lab-backend
          stage="dist/stage/nlink-lab-${RELEASE_TAG}-x86_64-linux-gnu"
          mkdir -p "$stage/completions"
          cp target/release/nlink-lab target/release/nlink-lab-backend "$stage/"
          for sh in bash zsh fish; do target/release/nlink-lab completions "$sh" > "$stage/completions/nlink-lab.$sh"; done
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$stage/"
          tar -C dist/stage -czf "dist/release/nlink-lab-${RELEASE_TAG}-x86_64-linux-gnu.tar.gz" "$(basename "$stage")"
      - name: Create release if missing
        # API-driven so a workflow_dispatch re-run of an existing tag is
        # idempotent: forgejo-release@v2 tries to create and 409s when the
        # release already exists (proven by the nlink-lab 0.8.0 re-run).
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="${FORGEJO_API}/repos/${GITHUB_REPOSITORY}"
          if ! curl -sf -H "Authorization: token $TOKEN" "$api/releases/tags/${RELEASE_TAG}" >/dev/null; then
            curl -sf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${RELEASE_SHA}\"}" \
              "$api/releases" >/dev/null
          fi
      - name: Attach release assets
        # delete-then-upload keeps re-runs idempotent; never override:true
        # (it recreates the release and wipes every asset)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="${FORGEJO_API}/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sf -H "Authorization: token $TOKEN" "$api/releases/tags/${RELEASE_TAG}" | jq -r .id)
          for f in dist/release/*; do
            name=$(basename "$f")
            for aid in $(curl -sf -H "Authorization: token $TOKEN" "$api/releases/$rid/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id'); do
              curl -sf -X DELETE -H "Authorization: token $TOKEN" "$api/releases/$rid/assets/$aid" >/dev/null
            done
            curl -sf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$rid/assets?name=$name" >/dev/null
            echo "attached $name"
          done

  flatpak:
    runs-on: flatpak
    # upload into the release created by the release job -- never runs a
    # racing create, and never use override: true (it wipes earlier assets)
    needs: release
    env:
      # SDK/runtime installs persist on the runner cache disk
      FLATPAK_USER_DIR: /srv/cache/flatpak/inst
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
      - name: Record this release in the AppStream metainfo
        # The metainfo used to be pinned at 0.1.0 forever (issue #53).
        run: |
          f=$(ls flatpak/*.metainfo.xml | head -1)
          if ! grep -q "release version=\"${RELEASE_TAG}\"" "$f"; then
            sed -i "s|<releases>|<releases>\n    <release version=\"${RELEASE_TAG}\" date=\"$(date -u +%F)\"/>|" "$f"
          fi
          grep -n '<release ' "$f" | head -3
      - name: Build flatpak (unsigned; vm-edge signs on publish)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # per-repo state dir on the cache disk: incremental module rebuilds
          # + ccache for C/C++ inside the sandbox. flatpak-builder requires
          # state dir and build tree on the same filesystem -> stage the
          # build on the cache disk and copy the bundle back.
          work=/srv/cache/flatpak/nlink-lab/work
          mkdir -p "$work" && rm -rf "$work/src" && cp -a . "$work/src"
          cd "$work/src"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --state-dir=/srv/cache/flatpak/nlink-lab/state --ccache \
            --install-deps-from=flathub \
            --repo=export-repo builddir flatpak/com.github.p13marc.NlinkLab.yml
          mkdir -p "$GITHUB_WORKSPACE/dist/release"
          flatpak build-bundle export-repo \
            "$GITHUB_WORKSPACE/dist/release/nlink-lab-topoviewer-${RELEASE_TAG}.flatpak" com.github.p13marc.NlinkLab
      - name: Publish export branch for vm-edge
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /srv/cache/flatpak/nlink-lab/work/src/export-repo
          git init -q -b flatpak-export
          git add -A
          git -c user.name=ci -c user.email=ci@marcpardo.eu commit -q -m "flatpak export ${RELEASE_TAG}"
          # token via a credential helper, never in the URL (issue #53)
          git -c credential.helper='!f() { echo "username=forgejo"; echo "password=${TOKEN}"; }; f' \
            push --force "${FORGEJO_API%/api/v1}/${GITHUB_REPOSITORY}.git" HEAD:flatpak-export
      - name: Attach bundle to the release
        # forgejo-release@v2 tries to create the release and 409s when it
        # already exists (the release job created it) -> attach via the API.
        # Delete-then-upload keeps dispatch re-runs idempotent. Never
        # override:true (it recreates the release and wipes every asset).
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="${FORGEJO_API}/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sf -H "Authorization: token $TOKEN" "$api/releases/tags/${RELEASE_TAG}" | jq -r .id)
          for f in "$GITHUB_WORKSPACE"/dist/release/*; do
            name=$(basename "$f")
            for aid in $(curl -sf -H "Authorization: token $TOKEN" "$api/releases/$rid/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id'); do
              curl -sf -X DELETE -H "Authorization: token $TOKEN" "$api/releases/$rid/assets/$aid" >/dev/null
            done
            curl -sf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$rid/assets?name=$name" >/dev/null
            echo "attached $name"
          done

  checksums:
    # runs last so SHA256SUMS covers every asset, including the flatpak
    # bundle (previously computed in the release job before flatpak ran)
    runs-on: ubuntu-24.04
    needs: [release, flatpak]
    if: always() && needs.release.result == 'success'
    steps:
      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Download every asset and attach SHA256SUMS
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="${FORGEJO_API}/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sf -H "Authorization: token $TOKEN" "$api/releases/tags/${RELEASE_TAG}" | jq -r .id)
          mkdir -p sums && cd sums
          curl -sf -H "Authorization: token $TOKEN" "$api/releases/$rid/assets" \
            | jq -r '.[] | select(.name != "SHA256SUMS") | "\(.id) \(.name)"' \
            | while read -r aid name; do
                curl -sfL -H "Authorization: token $TOKEN" -o "$name" "$api/releases/$rid/assets/$aid"
              done
          sha256sum * > SHA256SUMS
          for aid in $(curl -sf -H "Authorization: token $TOKEN" "$api/releases/$rid/assets" | jq -r '.[] | select(.name=="SHA256SUMS") | .id'); do
            curl -sf -X DELETE -H "Authorization: token $TOKEN" "$api/releases/$rid/assets/$aid" >/dev/null
          done
          curl -sf -X POST -H "Authorization: token $TOKEN" -F "attachment=@SHA256SUMS" "$api/releases/$rid/assets?name=SHA256SUMS" >/dev/null
          cat SHA256SUMS
