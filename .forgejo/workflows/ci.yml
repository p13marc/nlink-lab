name: CI
on:
  push:
    branches: [main, master]
    paths-ignore: ['LICENSE*']
  pull_request:
    paths-ignore: ['LICENSE*']
  # manual re-run path (flaky job, runner was offline, cache experiments)
  workflow_dispatch:
  # weekly fuzz job (see the `fuzz` job's `if:`)
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file.
  # Every job runs the "sccache guard" step first, which unsets this when the
  # cache mount is missing so an infra hiccup does not look like a compile error.
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 2.
  CARGO_BUILD_JOBS: "2"
  # Debug info is most of target/ and of the linker's memory, and the
  # workspace grew (the daemon's zenoh, the app's iced and wgpu): three
  # test lanes building it in parallel took the runner VM down (#293).
  # A panic still has its line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # These lanes run without CAP_NET_ADMIN/CAP_SYS_ADMIN (even as the
  # container's root): a test that deploys a lab skips here, loudly. Unset,
  # it fails instead (#298); the privileged lane is integration.yml.
  NLINK_LAB_SKIP_ROOT_TESTS: "1"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # the app without its embedded terminal: the test lanes build it once
      - run: cargo clippy -p nlink-lab-gui --all-targets --no-default-features -- -D warnings

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--no-default-features", "--all-features"]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: t-${{ matrix.features || 'default' }}
          cache-targets: false
      # The desktop app (iced, wgpu: the biggest build by far) has one
      # feature, its embedded terminal: it is built and tested in the
      # default lane only, and clippy checks it without the feature.
      - run: cargo build --workspace --all-targets ${{ matrix.features }} ${{ matrix.features != '' && '--exclude nlink-lab-gui' || '' }}
      # crates/nlink-lab/tests/integration.rs needs root/netns — it runs on
      # the privileged lane (integration.yml); everything else runs here.
      - run: cargo test --workspace ${{ matrix.features }} --exclude nlink-lab ${{ matrix.features != '' && '--exclude nlink-lab-gui' || '' }}
      - run: cargo test -p nlink-lab ${{ matrix.features }} --lib
      - run: cargo test -p nlink-lab ${{ matrix.features }} --doc
      # doc-CI gate: every ```nll block and relative link under docs/ (Plan 150 D)
      - run: cargo test -p nlink-lab ${{ matrix.features }} --test docs_examples --test editor_keywords --test render_roundtrip

  stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo test -p nlink-lab --test stress

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo doc --no-deps --all-features

  # The library's public API (#331): docs/public-api.txt is what
  # `cargo public-api` lists, so a change to the stable layer is reviewed.
  public-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      # the nightly whose rustdoc JSON cargo-public-api 0.51 reads
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-public-api@0.51.0
      - run: cargo +nightly-2026-10-28 public-api -p nlink-lab --all-features -sss > docs/public-api.txt
      - run: |
          git diff --exit-code docs/public-api.txt || {
            echo "::error::the library's public API changed: run \`just public-api\` and commit docs/public-api.txt"
            exit 1
          }

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      # the docker cargo-deny action cannot see deny.toml -> install directly
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-deny
      - run: cargo deny check

  # rust-toolchain.toml pins the fleet rustc; this job proves the declared
  # MSRV (Cargo.toml rust-version) still builds and tests, independent of it.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: Read rust-version from Cargo.toml
        run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
          cache-targets: false
      - run: rustup override set "$MSRV"
      - run: cargo build --workspace --all-targets
      - run: cargo test -p nlink-lab --lib

  # ...and this one proves current stable does not reject the tree (new
  # lints, edition changes) before the next toolchain pin bump.
  stable-latest:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: stable-latest
          cache-targets: false
      - run: rustup override set stable
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test -p nlink-lab --lib

  # rootless smoke test of the built binary: exercises clap wiring, every
  # example topology, and the JSON envelopes without a single namespace.
  cli-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: cli-smoke
          cache-targets: false
      - run: cargo build -p nlink-lab-cli
      - run: ./scripts/cli-smoke.sh target/debug/nlink-lab
      # NLL sources are kept fmt-clean (token-level formatter, issue #54)
      - run: target/debug/nlink-lab fmt --check examples
      # docs/cli reference blocks are generated from clap, and every count
      # the docs state (<!-- count:NAME -->: rules, commands, examples, the
      # API version) from the code (#345); a stale page or count, a page of
      # a removed command or one never committed fails here
      - run: |
          target/debug/nlink-lab docs-gen --out docs/cli --schemas docs/json-schemas --prune
          git diff --exit-code -- README.md CLAUDE.md docs
          untracked=$(git status --porcelain --untracked-files=all -- docs/cli docs/json-schemas)
          if [ -n "$untracked" ]; then echo "::error::generated docs not committed:"; echo "$untracked"; exit 1; fi

  # Editor grammar conformance (issue #27): the committed parser must be
  # what grammar.js generates, the corpus must pass, and every example
  # topology must parse without ERROR/MISSING nodes. `just tree-sitter`
  # runs the same locally.
  tree-sitter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/tree-sitter-nll
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: npm install --no-save --no-audit --no-fund tree-sitter-cli@0.27.0
      - name: Generated parser is committed
        run: ./node_modules/.bin/tree-sitter generate && git diff --exit-code -- src/
      - name: Corpus
        run: ./node_modules/.bin/tree-sitter test
      # A parse that prints no tree at all must fail too: this step used to
      # grep only for ERROR/MISSING, and it stayed green while
      # examples/frr-bgp.nll (`validate retries … {`) did not parse, so in
      # CI it was not parsing anything. `-p .` names this grammar.
      - name: Every example parses
        run: |
          status=0
          for f in ../../examples/*.nll ../../examples/*/*.nll; do
            out=$(./node_modules/.bin/tree-sitter parse -p . "$f" 2>&1 || true)
            if ! printf '%s' "$out" | grep -q '(source_file' || printf '%s' "$out" | grep -qE 'ERROR|MISSING'; then
              echo "::error::$f does not parse with the tree-sitter grammar"; echo "$out" | tail -5; status=1
            fi
          done
          exit $status

  # Short libFuzzer run of the three parser targets. Informational: it
  # runs weekly and on demand, never blocks a PR, and uploads any crash
  # or timeout artifact. `just fuzz` runs the same locally.
  fuzz:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: https://github.com/dtolnay/rust-toolchain@nightly
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-fuzz
      # `cargo fuzz` defaults `--target` to the triple cargo-fuzz ITSELF was
      # built for (`current_platform::CURRENT_PLATFORM`), and install-action
      # ships the static musl binary on Linux -- so without an explicit
      # target every run died in seconds with "sanitizer is incompatible
      # with statically linked libc" / "can't find crate for `core`
      # (x86_64-unknown-linux-musl)". Pin it to the toolchain's host.
      - run: |
          cd crates/nlink-lab
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          for t in fuzz_lex fuzz_parse fuzz_roundtrip; do
            cargo +nightly fuzz run --target "$host" "$t" -- -max_total_time=90 -timeout=10
          done
      - uses: https://data.forgejo.org/actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: crates/nlink-lab/fuzz/artifacts
