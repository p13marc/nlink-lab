name: Integration
# Privileged runner lane (label `integration`); wireguard module preloaded
# on the runner VM (myserver docs/vm-runner.md).
on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file.
  # Guarded by the first step so a missing mount does not fail the build.
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  integration:
    runs-on: integration
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Ping issue 81
        run: |
          set +e
          post() { # $1 = markdown file
            for base in "${{ github.api_url }}" "${{ github.server_url }}/api/v1"; do
              code=$(curl -sS -m 20 -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" --data-urlencode "body@$1" "$base/repos/${{ github.repository }}/issues/81/comments" -o /dev/null -w '%{http_code}')
              echo "post via $base -> $code"; [ "$code" = 201 ] && return 0
            done; return 0
          }
          { echo "### diag run ${{ github.run_number }} on ${{ github.sha }} started"; echo '```'; uname -a; cat /etc/os-release | head -1; free -m | head -2; echo '```'; } > /tmp/ping.md
          post /tmp/ping.md
      - name: sccache guard
        run: test -x "$RUSTC_WRAPPER" || { echo "::warning::sccache missing at $RUSTC_WRAPPER; building without it"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      # The tests exec `ip`/`nft`/`ping`/`tc`/`wg`/`getent` INSIDE the lab
      # namespaces, which share this job's rootfs (only the net namespace
      # changes) — so every one of those binaries must be installed here.
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping procps libc-bin wireguard-tools iperf3
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: integration
          cache-targets: false
      - name: Guard that kernel modules are preloaded on the runner VM
        run: |
          for m in nf_tables vrf wireguard bridge; do
            test -d "/sys/module/$m" || echo "::warning::module $m not loaded; dependent tests will skip"
          done
      - run: cargo build --bin nlink-lab
      # Gating since wave 3 of the deep-analysis series: 62/62 pass on a
      # Debian 13 host once iproute2/nftables/iputils are installed and
      # /usr/sbin is on PATH under sudo (tc/nft live there). The earlier
      # "6/62" was those packages missing from the job container (#52).
      # Build as the runner user, run only the test binary as root, so
      # target/ stays user-owned. The binary path comes from cargo's JSON
      # messages: the human output is coloured under CARGO_TERM_COLOR=always
      # (set by the toolchain action), which made a text grep miss and left
      # `$bin` empty — the cause of the red lane between runs 79 and 81 (#81).
      - name: Integration tests
        run: |
          bin=$(cargo test -p nlink-lab --test integration --no-run --message-format=json 2>/dev/null | grep -oP '"executable":"\K[^"]+' | head -1)
          test -n "$bin" || { echo "::error::integration test binary not found"; exit 1; }
          sudo -E env "PATH=$PATH:/usr/sbin:/sbin" NLINK_LAB_SKIP_ROOT_TESTS= "$bin" --test-threads=1 > /tmp/it-default.log 2>&1; rc=$?; cat /tmp/it-default.log; echo "rc=$rc" >> /tmp/it-default.log; exit $rc
      - name: Integration tests (all features)
        if: always()
        run: |
          bin=$(cargo test -p nlink-lab --all-features --test integration --no-run --message-format=json 2>/dev/null | grep -oP '"executable":"\K[^"]+' | head -1)
          test -n "$bin" || { echo "::error::integration test binary (all features) not found"; exit 1; }
          sudo -E env "PATH=$PATH:/usr/sbin:/sbin" NLINK_LAB_SKIP_ROOT_TESTS= "$bin" --test-threads=1 > /tmp/it-all.log 2>&1; rc=$?; cat /tmp/it-all.log; echo "rc=$rc" >> /tmp/it-all.log; exit $rc
      - name: No lab debris left behind
        if: always()
        run: |
          { echo "## ip netns list"; sudo ip netns list; echo "## /etc/netns"; sudo ls -laR /etc/netns; } > /tmp/debris.log 2>&1 || true
          sudo ip netns list | tee /dev/stderr | grep -q . && { echo "::error::leftover network namespaces"; exit 1; } || true
          test -z "$(sudo ls /etc/netns 2>/dev/null)" || { echo "::error::leftover /etc/netns tags"; sudo ls /etc/netns; exit 1; }
      - name: Report diagnostics to issue 81
        if: always()
        run: |
          set +e
          post() { # $1 = markdown file
            for base in "${{ github.api_url }}" "${{ github.server_url }}/api/v1"; do
              code=$(curl -sS -m 20 -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" --data-urlencode "body@$1" "$base/repos/${{ github.repository }}/issues/81/comments" -o /dev/null -w '%{http_code}')
              echo "post via $base -> $code"; [ "$code" = 201 ] && return 0
            done; return 0
          }
          {
            echo "### diag run ${{ github.run_number }} on ${{ github.sha }} finished"
            echo '```'
            for f in /tmp/it-default.log /tmp/it-all.log; do echo "== $f (non-ok lines, tail)"; grep -vE '^test .* ok$' "$f" 2>&1 | tail -80; done
            echo "== debris"; cat /tmp/debris.log 2>&1
            echo '```'
          } > /tmp/report.md
          post /tmp/report.md
