[package]
name = "nlink-lab-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not on crates.io: releases are Forgejo tarballs + flatpak (deny.toml relies on this)
publish = false
license.workspace = true
authors.workspace = true
description = "Zenoh backend daemon for nlink-lab — publishes live metrics and handles RPC"

[lib]
name = "nlink_lab_backend"
path = "src/lib.rs"

[[bin]]
name = "nlink-lab-backend"
path = "src/main.rs"

[dependencies]
zenoh = { workspace = true }
zenoh-ext = { workspace = true }
nlink-lab = { workspace = true }
nlink-lab-shared = { workspace = true }
nlink = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
