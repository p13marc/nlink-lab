[package]
name = "nlink-lab-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not on crates.io: releases are Forgejo tarballs + flatpak (deny.toml relies on this)
publish = false
license.workspace = true
authors.workspace = true
description = "The nlink-lab desktop app"

[[bin]]
name = "nlink-lab-gui"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio"] }
nlink-lab = { workspace = true }
nlink-lab-view = { workspace = true }
nlink-lab-shared = { workspace = true }
# the daemon's client; `zenoh` for a daemon reached over Zenoh
nlink-lab-client = { workspace = true, features = ["zenoh"] }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# file dialogs through the XDG desktop portal (the flatpak's way out)
rfd = "0.17"
# PNG export: the SVG export, rasterised
resvg = "0.48"

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"
# a real daemon, in-process, for the backend's tests
nlink-labd = { path = "../nlink-labd" }
libc = { workspace = true }
