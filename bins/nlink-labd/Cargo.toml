[package]
name = "nlink-labd"
description = "The nlink-lab host daemon: every lab of the host behind one authenticated API, on a unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not on crates.io: releases are Forgejo tarballs + flatpak (deny.toml relies on this)
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "nlink_labd"
path = "src/lib.rs"

[[bin]]
name = "nlink-labd"
path = "src/main.rs"

[features]
default = ["zenoh"]
# every lab's telemetry over Zenoh (`[zenoh]` in daemon.toml)
zenoh = ["dep:zenoh"]

[dependencies]
nlink-lab = { workspace = true }
nlink-lab-shared = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
zenoh = { workspace = true, optional = true }

[dev-dependencies]
nlink-lab-client = { workspace = true, features = ["zenoh"] }
rcgen = "0.14"
tempfile = "3"
zenoh = { workspace = true }
